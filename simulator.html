<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameLab Editor</title>
<style>
:root{--bg:#383838;--p:#2d2d2d;--h:#1f1f1f;--b:#191919;--t:#d2d2d2;--a:#3a79bb}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--b);color:var(--t);font:13px "Segoe UI",Tahoma,sans-serif}
#app{display:grid;height:100%;grid-template-rows:38px 1fr 42%;grid-template-columns:200px 1fr 230px;gap:2px}
.top{grid-column:1/4;background:var(--h);display:flex;align-items:center;gap:8px;padding:0 10px}
.top .sp{flex:1}
button,select{background:#4a4a4a;color:var(--t);border:1px solid #1a1a1a;border-radius:3px;padding:4px 10px;cursor:pointer;font:inherit}
button:hover{background:#585858}
#play{background:#2f6b2f}#play.on{background:var(--a)}
.pn{background:var(--p);overflow:auto;display:flex;flex-direction:column;min-height:0}
.ph{background:var(--h);padding:5px 10px;border-bottom:1px solid var(--b);display:flex;gap:6px;align-items:center}
.ph .sp{flex:1}
.it{padding:5px 12px;cursor:pointer}.it:hover{background:#3b3b3b}.it.sel{background:var(--a);color:#fff}
.stage{position:relative;background:#222;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.f{display:flex;align-items:center;gap:6px;padding:4px 10px}
.f label{width:60px;opacity:.8}
.f input{flex:1;min-width:0;background:#222;color:var(--t);border:1px solid #111;border-radius:3px;padding:3px 5px}
.bot{grid-column:1/4}
.tabs button{border-radius:0;border:0;background:transparent;padding:5px 14px}
.tabs button.act{background:var(--p);border-bottom:2px solid var(--a)}
.body{flex:1;position:relative;min-height:0}
#blk,#code{position:absolute;inset:0;width:100%;height:100%}
#code{display:none;background:#1e1e1e;color:#9cdcfe;border:0;padding:10px;font:13px Consolas,monospace;resize:none;direction:ltr}
#msg{color:#f88;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button id="play" onclick="togglePlay()">▶ <span data-i="play"></span></button>
    <b id="sc"></b><span id="msg"></span>
    <span class="sp"></span>
    <span>🌐</span>
    <select id="lang" onchange="setLang(this.value)"><option value="en">English</option><option value="fa">فارسی</option></select>
  </div>

  <div class="pn">
    <div class="ph"><b data-i="hier"></b><span class="sp"></span><button onclick="addSprite()">＋</button><button onclick="delSprite()">🗑</button></div>
    <div id="list"></div>
  </div>

  <div class="pn">
    <div class="ph"><b data-i="scene"></b></div>
    <div class="stage"><canvas id="cv" width="640" height="400"></canvas></div>
  </div>

  <div class="pn">
    <div class="ph"><b data-i="insp"></b></div>
    <div class="f"><label data-i="name"></label><input id="i_name"></div>
    <div class="f"><label>X</label><input id="i_x" type="number"></div>
    <div class="f"><label>Y</label><input id="i_y" type="number"></div>
    <div class="f"><label data-i="size"></label><input id="i_size" type="number"></div>
    <div class="f"><label data-i="char"></label><input id="i_emo"></div>
  </div>

  <div class="pn bot">
    <div class="ph tabs" style="padding:0">
      <button id="t_blk" class="act" onclick="tab('blk')" data-i="blocks"></button>
      <button id="t_code" onclick="tab('code')" data-i="code"></button>
    </div>
    <div class="body"><div id="blk"></div><textarea id="code" spellcheck="false"></textarea></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blockly_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/blocks_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/javascript_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/msg/en.js"></script>
<script>window.EN=Object.assign({},Blockly.Msg)</script>
<script src="https://cdn.jsdelivr.net/npm/blockly@10.4.3/msg/fa.js"></script>
<script>window.FA=Object.assign({},Blockly.Msg)</script>
<script>
const T={
en:{play:'Play',stop:'Stop',hier:'Hierarchy',scene:'Scene / Game',insp:'Inspector',name:'Name',size:'Size',char:'Character',blocks:'Blocks',code:'Code',
 ev:'Events',mo:'Motion',se:'Sensing',lg:'Logic',lp:'Loops',ma:'Math',
 start:'when game starts',upd:'every frame',move:'move by x %1 y %2',go:'go to x %1 y %2',key:'key %1 pressed',touch:'touching',score:'change score by %1',scoreL:'Score',
 hint:'// API: onStart(fn), onUpdate(fn), me.x, me.y, S.keys["ArrowLeft"], S.touch(me,"Name"), S.score\n// Edit this code freely; it overrides the blocks for this character.\n'},
fa:{play:'اجرا',stop:'توقف',hier:'سلسله‌مراتب',scene:'صحنه / بازی',insp:'بازرس',name:'نام',size:'اندازه',char:'کاراکتر',blocks:'بلوک‌ها',code:'کد',
 ev:'رویدادها',mo:'حرکت',se:'حس‌گر',lg:'منطق',lp:'حلقه‌ها',ma:'ریاضی',
 start:'وقتی بازی شروع شد',upd:'در هر فریم',move:'حرکت به اندازه x %1 y %2',go:'برو به x %1 y %2',key:'کلید %1 زده شده',touch:'برخورد با',score:'امتیاز را %1 تغییر بده',scoreL:'امتیاز',
 hint:'// API: onStart(fn), onUpdate(fn), me.x, me.y, S.keys["ArrowLeft"], S.touch(me,"Name"), S.score\n// این کد را آزادانه ویرایش کن؛ جای بلوک‌های این کاراکتر اجرا می‌شود.\n'}};
let L='en';const t=k=>T[L][k];

/* ---------- helpers for default programs ---------- */
const n=v=>`<shadow type="math_number"><field name="NUM">${v}</field></shadow>`;
const mv=(ty,x,y)=>`<block type="${ty}"><value name="X">${n(x)}</value><value name="Y">${n(y)}</value></block>`;
const chain=a=>a.reduceRight((acc,b)=>b.replace(/<\/block>$/,(acc?`<next>${acc}</next>`:'')+'</block>'),'');
const ifk=(k,x,y)=>`<block type="controls_if"><value name="IF0"><block type="key"><field name="K">${k}</field></block></value><statement name="DO0">${mv('move',x,y)}</statement></block>`;
const hat=(ty,body)=>`<xml><block type="${ty}" x="20" y="20"><statement name="DO">${body}</statement></block></xml>`;
const playerXml=hat('on_update',chain([ifk('ArrowLeft',-4,0),ifk('ArrowRight',4,0),ifk('ArrowUp',0,4),ifk('ArrowDown',0,-4)]));
const starXml=hat('on_update',`<block type="controls_if"><value name="IF0"><block type="touching"><field name="N">Player</field></block></value><statement name="DO0">${chain([`<block type="score"><value name="V">${n(1)}</value></block>`,`<block type="setpos"><value name="X"><block type="math_random_int"><value name="FROM">${n(-250)}</value><value name="TO">${n(250)}</value></block></value><value name="Y"><block type="math_random_int"><value name="FROM">${n(-150)}</value><value name="TO">${n(150)}</value></block></value></block>`])}</statement></block>`);

/* ---------- state ---------- */
let sprites=[{name:'Player',emo:'🚀',x:0,y:0,size:56,xml:playerXml,js:'',custom:false},
             {name:'Star',emo:'⭐',x:150,y:80,size:44,xml:starXml,js:'',custom:false}];
let cur=sprites[0],ws=null,running=false,snap=null,raf=0;
const S={keys:{},score:0,touch(a,nm){const o=sprites.find(s=>s.name==nm);return !!o&&o!==a&&Math.hypot(a.x-o.x,a.y-o.y)<(a.size+o.size)/2}};
const $=id=>document.getElementById(id);

/* ---------- blocks ---------- */
function defBlocks(){
  const num=(nm)=>({type:'input_value',name:nm,check:'Number'});
  Blockly.defineBlocksWithJsonArray([
    {type:'on_start',message0:t('start'),message1:'%1',args1:[{type:'input_statement',name:'DO'}],colour:45},
    {type:'on_update',message0:t('upd'),message1:'%1',args1:[{type:'input_statement',name:'DO'}],colour:45},
    {type:'move',message0:t('move'),args0:[num('X'),num('Y')],inputsInline:true,previousStatement:null,nextStatement:null,colour:210},
    {type:'setpos',message0:t('go'),args0:[num('X'),num('Y')],inputsInline:true,previousStatement:null,nextStatement:null,colour:210},
    {type:'score',message0:t('score'),args0:[num('V')],inputsInline:true,previousStatement:null,nextStatement:null,colour:20},
    {type:'key',message0:t('key'),args0:[{type:'field_dropdown',name:'K',options:[['←','ArrowLeft'],['→','ArrowRight'],['↑','ArrowUp'],['↓','ArrowDown'],['Space',' ']]}],output:'Boolean',colour:180}
  ]);
  Blockly.Blocks['touching']={init(){this.appendDummyInput().appendField(t('touch')).appendField(new Blockly.FieldDropdown(()=>sprites.map(s=>[s.name,s.name])),'N');this.setOutput(true,'Boolean');this.setColour(180);}};
  const G=Blockly.JavaScript,fb=G.forBlock,O=G.ORDER_NONE;
  const v=(b,g,k)=>g.valueToCode(b,k,O)||'0';
  fb['on_start']=(b,g)=>`onStart(function(){\n${g.statementToCode(b,'DO')}});\n`;
  fb['on_update']=(b,g)=>`onUpdate(function(){\n${g.statementToCode(b,'DO')}});\n`;
  fb['move']=(b,g)=>`me.x += ${v(b,g,'X')}; me.y += ${v(b,g,'Y')};\n`;
  fb['setpos']=(b,g)=>`me.x = ${v(b,g,'X')}; me.y = ${v(b,g,'Y')};\n`;
  fb['score']=(b,g)=>`S.score += ${v(b,g,'V')};\n`;
  fb['key']=b=>[`!!S.keys[${JSON.stringify(b.getFieldValue('K'))}]`,G.ORDER_ATOMIC];
  fb['touching']=b=>[`S.touch(me, ${JSON.stringify(b.getFieldValue('N'))})`,G.ORDER_ATOMIC];
}
function toolbox(){
  const sh=(x)=>`<value name="X">${n(x)}</value>`;
  const m=ty=>`<block type="${ty}">${sh(0)}<value name="Y">${n(0)}</value></block>`;
  return `<xml><category name="${t('ev')}" colour="45"><block type="on_start"></block><block type="on_update"></block></category>
  <category name="${t('mo')}" colour="210">${m('move')}${m('setpos')}<block type="score"><value name="V">${n(1)}</value></block></category>
  <category name="${t('se')}" colour="180"><block type="key"></block><block type="touching"></block></category>
  <category name="${t('lg')}" colour="210"><block type="controls_if"></block><block type="logic_compare"></block><block type="logic_operation"></block><block type="logic_negate"></block></category>
  <category name="${t('lp')}" colour="120"><block type="controls_repeat_ext"><value name="TIMES">${n(10)}</value></block><block type="controls_whileUntil"></block></category>
  <category name="${t('ma')}" colour="230"><block type="math_number"></block><block type="math_arithmetic"></block><block type="math_random_int"><value name="FROM">${n(1)}</value><value name="TO">${n(100)}</value></block></category></xml>`;
}
const dark=Blockly.Theme.defineTheme('dk',{base:Blockly.Themes.Classic,componentStyles:{workspaceBackgroundColour:'#1e1e1e',toolboxBackgroundColour:'#2a2a2a',toolboxForegroundColour:'#ddd',flyoutBackgroundColour:'#333',flyoutForegroundColour:'#ccc',flyoutOpacity:1,scrollbarColour:'#666',insertionMarkerColour:'#fff',insertionMarkerOpacity:.3,cursorColour:'#d0d0d0'}});
const saveXml=()=>Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(ws));
function loadXml(){ws.clear();try{Blockly.Xml.domToWorkspace(Blockly.utils.xml.textToDom(cur.xml||'<xml></xml>'),ws)}catch(e){}}
function mkWS(){
  if(ws){cur.xml=saveXml();ws.dispose();}
  defBlocks();Object.assign(Blockly.Msg,L=='fa'?FA:EN);
  ws=Blockly.inject('blk',{toolbox:toolbox(),rtl:L=='fa',theme:dark,trashcan:true,grid:{spacing:25,length:2,colour:'#333',snap:true}});
  loadXml();
  ws.addChangeListener(e=>{if(e.isUiEvent)return;cur.xml=saveXml();if(!cur.custom)genCode();});
  genCode();
}
function genCode(){cur.js=Blockly.JavaScript.workspaceToCode(ws);if(!cur.custom)$('code').value=t('hint')+cur.js;}

/* ---------- UI ---------- */
function setLang(l){L=l;document.documentElement.dir=l=='fa'?'rtl':'ltr';document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('play').innerHTML='▶ '+t(running?'stop':'play');mkWS();renderList();}
function tab(x){$('blk').style.display=x=='blk'?'block':'none';$('code').style.display=x=='code'?'block':'none';
  $('t_blk').classList.toggle('act',x=='blk');$('t_code').classList.toggle('act',x=='code');
  if(x=='code'&&!cur.custom)genCode();else Blockly.svgResize(ws);}
$('code').addEventListener('input',e=>{cur.custom=true;cur.js=e.target.value;});
function renderList(){const l=$('list');l.innerHTML='';sprites.forEach(s=>{const d=document.createElement('div');d.className='it'+(s==cur?' sel':'');d.textContent=s.emo+' '+s.name;d.onclick=()=>select(s);l.appendChild(d);});fillInsp();}
function select(s){if(s==cur)return;cur.xml=saveXml();cur=s;loadXml();$('code').value=s.custom?s.js:t('hint')+s.js;renderList();if(!s.custom)genCode();}
function fillInsp(){$('i_name').value=cur.name;$('i_x').value=Math.round(cur.x);$('i_y').value=Math.round(cur.y);$('i_size').value=cur.size;$('i_emo').value=cur.emo;}
['name','x','y','size','emo'].forEach(k=>$('i_'+k).addEventListener('input',e=>{const v=e.target.value;cur[k]=['x','y','size'].includes(k)?(+v||0):v;if(k=='name'||k=='emo')renderListKeep();}));
function renderListKeep(){const a=document.activeElement;renderList();a.focus&&a.focus();}
const EM=['👾','🐱','🍎','🧱','🐸','🚗'];
function addSprite(){const s={name:'Object'+(sprites.length+1),emo:EM[sprites.length%EM.length],x:0,y:0,size:48,xml:'<xml></xml>',js:'',custom:false};sprites.push(s);select(s);}
function delSprite(){if(sprites.length<2)return;sprites.splice(sprites.indexOf(cur),1);cur=sprites[0];loadXml();genCode();renderList();}

/* ---------- stage ---------- */
const cv=$('cv'),cx=cv.getContext('2d'),W=640,H=400;
function draw(){
  cx.fillStyle='#2b2b2b';cx.fillRect(0,0,W,H);cx.strokeStyle='#363636';cx.lineWidth=1;
  for(let x=0;x<=W;x+=40){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
  for(let y=0;y<=H;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}
  cx.strokeStyle='#555';cx.beginPath();cx.moveTo(W/2,0);cx.lineTo(W/2,H);cx.moveTo(0,H/2);cx.lineTo(W,H/2);cx.stroke();
  cx.textAlign='center';cx.textBaseline='middle';
  sprites.forEach(s=>{const X=W/2+s.x,Y=H/2-s.y;cx.font=s.size+'px serif';cx.fillStyle='#fff';cx.fillText(s.emo,X,Y);
    if(!running&&s==cur){cx.strokeStyle='#4da3ff';cx.lineWidth=2;cx.strokeRect(X-s.size/2,Y-s.size/2,s.size,s.size);}});
}
let drag=null;
function pos(e){const r=cv.getBoundingClientRect(),k=Math.min(r.width/W,r.height/H),ox=(r.width-W*k)/2,oy=(r.height-H*k)/2;return{x:(e.clientX-r.left-ox)/k-W/2,y:H/2-(e.clientY-r.top-oy)/k};}
cv.addEventListener('pointerdown',e=>{if(running)return;const p=pos(e),h=[...sprites].reverse().find(s=>Math.abs(s.x-p.x)<s.size/2&&Math.abs(s.y-p.y)<s.size/2);if(h){select(h);drag={dx:h.x-p.x,dy:h.y-p.y};cv.setPointerCapture(e.pointerId);}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);cur.x=p.x+drag.dx;cur.y=p.y+drag.dy;fillInsp();});
cv.addEventListener('pointerup',()=>drag=null);

/* ---------- run ---------- */
function togglePlay(){running?stop():play();}
function play(){
  cur.xml=saveXml();if(!cur.custom)genCode();
  snap=JSON.stringify(sprites.map(s=>[s.x,s.y]));S.score=0;S.keys={};$('msg').textContent='';
  const ups=[];
  try{sprites.forEach(s=>{
    if(!s.custom){const w=new Blockly.Workspace();try{Blockly.Xml.domToWorkspace(Blockly.utils.xml.textToDom(s.xml||'<xml></xml>'),w);s.js=Blockly.JavaScript.workspaceToCode(w);}finally{w.dispose();}}
    new Function('me','onStart','onUpdate','S',s.js)(s,f=>f(),f=>ups.push(f),S);});
  }catch(e){$('msg').textContent='⚠ '+e.message;return;}
  running=true;$('play').classList.add('on');$('play').innerHTML='■ '+t('stop');
  const loop=()=>{if(!running)return;try{ups.forEach(f=>f());}catch(e){$('msg').textContent='⚠ '+e.message;stop();return;}
    $('sc').textContent=t('scoreL')+': '+S.score;draw();raf=requestAnimationFrame(loop);};loop();
}
function stop(){running=false;cancelAnimationFrame(raf);JSON.parse(snap||'[]').forEach((p,i)=>{sprites[i].x=p[0];sprites[i].y=p[1];});
  $('play').classList.remove('on');$('play').innerHTML='▶ '+t('play');$('sc').textContent='';fillInsp();draw();}
addEventListener('keydown',e=>{if(!running)return;S.keys[e.key]=true;if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();});
addEventListener('keyup',e=>{S.keys[e.key]=false;});
new ResizeObserver(()=>ws&&Blockly.svgResize(ws)).observe($('blk'));
(function ed(){if(!running)draw();requestAnimationFrame(ed);})();
setLang('en');
</script>
</body>
</html>
