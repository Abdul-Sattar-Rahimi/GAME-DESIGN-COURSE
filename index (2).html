<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdolsattar Rahimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Vazirmatn:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0414;--pink:#ff2e88;--cyan:#2de2e6;--yellow:#ffe14d;--orange:#ffa530;--text:#eadfff;--fh:clamp(260px,40svh,380px)}
*{box-sizing:border-box;margin:0}
body{position:relative;min-height:100svh;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:'VT323','Vazirmatn',monospace;font-size:1.45rem;line-height:1.3}
html[lang="fa"] body{font-family:'Vazirmatn',sans-serif;font-size:1.05rem;line-height:1.8}
.px{font-family:'Press Start 2P',monospace}
html[lang="fa"] .px.t{font-family:'Vazirmatn',sans-serif;font-weight:800}
html[lang="en"] .up{text-transform:uppercase}

/* background */
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;display:block;animation:tw 2.4s steps(2) infinite}
.stars i.x{box-shadow:3px 0,-3px 0,0 3px,0 -3px}
@keyframes tw{50%{opacity:.2}}
.halo{position:absolute;left:0;right:0;bottom:var(--fh);height:110px;background:radial-gradient(50% 100% at 50% 100%,rgba(255,60,160,.55),transparent 70%);pointer-events:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:var(--fh);overflow:hidden;pointer-events:none;background:linear-gradient(#240733,var(--bg) 75%);
  -webkit-mask-image:linear-gradient(#000 65%,rgba(0,0,0,.35));mask-image:linear-gradient(#000 65%,rgba(0,0,0,.35))}
.floor::before{content:"";position:absolute;top:0;left:0;right:0;height:70px;z-index:2;background:radial-gradient(50% 100% at 50% 0,rgba(255,100,180,.95),rgba(255,46,136,.25) 55%,transparent 75%)}
.grid{position:absolute;left:-100%;width:300%;bottom:0;height:3000px;transform-origin:50% 100%;transform:perspective(calc(var(--fh)*3.08)) rotateX(72deg);
  background:linear-gradient(90deg,var(--pink) 2px,transparent 2px) 0 0/90px 100%,linear-gradient(var(--pink) 2px,transparent 2px) 0 0/100% 70px;animation:fly 1.4s linear infinite}
@keyframes fly{from{background-position:0 0,0 0}to{background-position:0 0,0 70px}}
.planet{position:absolute;top:92px;left:6%;width:54px;height:41px;animation:bob 3s steps(4) infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(8px)}}

/* layout */
.screen{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));max-width:960px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;direction:ltr;font-size:clamp(9px,2.8vw,14px);color:#fff}
.hud b{font-weight:400;margin-right:.6em}
.c{color:var(--cyan)}.y{color:var(--yellow)}.o{color:var(--orange)}
.lang{display:flex;gap:10px;justify-content:center;margin-top:14px}
.lang button{font:inherit;font-family:'Vazirmatn',sans-serif;font-weight:700;font-size:.9rem;line-height:1.2;padding:6px 14px;background:transparent;color:var(--cyan);border:2px solid var(--cyan);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#2a0a00}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 0 40px}
.avatar{width:clamp(130px,38vw,180px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#1d0b33;border:4px solid var(--yellow);box-shadow:0 0 0 4px #b8470d,0 0 34px rgba(255,46,136,.6);margin-bottom:30px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:clamp(1.3rem,7.4vw,3.2rem);line-height:1.25;color:#ffe65c;font-weight:400;
  text-shadow:.05em .05em 0 #ff9d1c,.1em .1em 0 #b8470d,.15em .15em 0 #3a1408,0 0 40px rgba(255,46,136,.4)}
h1 span{display:block}
.course{margin-top:26px;font-size:clamp(.6rem,3vw,.8rem);color:var(--cyan);letter-spacing:.08em}
.desc{margin-top:16px;max-width:30em;color:var(--text)}
.prompt{margin-top:30px;font-size:clamp(.6rem,3.2vw,.95rem);color:var(--orange);letter-spacing:.12em;animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.actions{display:grid;gap:24px;width:min(100%,340px);margin-top:26px}
@media(min-width:680px){.actions{display:flex;width:auto;gap:36px}}
.btn{border:0;cursor:pointer;font-size:clamp(.6rem,2.9vw,.78rem);line-height:1.5;padding:18px 22px;text-align:center}
html[lang="fa"] .btn{font-size:1rem}
.primary{background:var(--yellow);color:#2a0a00;box-shadow:0 -4px 0 var(--yellow),0 4px 0 var(--yellow),-4px 0 0 var(--yellow),4px 0 0 var(--yellow),inset 0 -6px 0 #f0a010,0 0 26px rgba(255,200,40,.35)}
.secondary{background:#140729;color:var(--cyan);box-shadow:0 -4px 0 var(--cyan),0 4px 0 var(--cyan),-4px 0 0 var(--cyan),4px 0 0 var(--cyan),0 0 26px rgba(45,226,230,.25)}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(3px)}
.btn:focus-visible,.lang button:focus-visible{outline:3px solid #fff;outline-offset:8px}
.note{margin-top:18px;min-height:1.4em;color:var(--cyan)}

.bottom{margin-top:auto;position:relative}
.hearts{display:flex;gap:4px}
.heart{width:clamp(18px,5.4vw,28px);aspect-ratio:7/6;fill:#ff3b6b;shape-rendering:crispEdges}

#overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
#overlay.open{display:flex}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:3px solid var(--pink);background:#140729}
.bar span{font-size:.75rem;color:var(--yellow)}
.close{padding:10px 16px;font-size:.7rem}
html[lang="fa"] .close{font-size:.95rem}
#overlay iframe{flex:1;width:100%;border:0;background:#000}
@media(prefers-reduced-motion:reduce){.grid,.planet,.prompt,.stars i{animation:none}}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>
<div class="halo" aria-hidden="true"></div>
<div class="floor" aria-hidden="true"><div class="grid"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="h" viewBox="0 0 7 6"><path d="M1 0h2v1H1zM4 0h2v1H4zM0 1h7v2H0zM1 3h5v1H1zM2 4h3v1H2zM3 5h1v1H3z"/><path fill="#ffc2d1" d="M1 1h1v1H1z"/></symbol>
</defs></svg>

<svg class="planet" viewBox="0 0 16 12" shape-rendering="crispEdges" aria-hidden="true">
  <g fill="#ff6fa5"><rect x="6" y="0" width="4" height="1"/><rect x="4" y="1" width="8" height="1"/><rect x="3" y="2" width="10" height="1"/><rect x="2" y="3" width="12" height="6"/><rect x="3" y="9" width="10" height="1"/><rect x="4" y="10" width="8" height="1"/><rect x="6" y="11" width="4" height="1"/></g>
  <g fill="#d4468a"><rect x="10" y="6" width="4" height="3"/><rect x="9" y="9" width="4" height="1"/><rect x="8" y="10" width="4" height="1"/></g>
  <g fill="#ffc0d9"><rect x="5" y="2" width="3" height="1"/><rect x="4" y="3" width="2" height="1"/></g>
  <rect x="0" y="4" width="16" height="1" fill="#7ff6f8"/><rect x="0" y="5" width="16" height="1" fill="#2de2e6"/>
</svg>

<div class="screen">
  <header class="hud px"><span><b class="c">1UP</b>000524</span><span><b class="y">HI</b>999999</span></header>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="true">English</button>
    <button data-lang="fa" aria-pressed="false">فارسی</button>
  </div>

  <main>
    <div class="avatar"><img id="photo" src="profile.jpg" alt=""></div>
    <h1 class="px t up"><span data-i18n="name1"></span><span data-i18n="name2"></span></h1>
    <p class="course px t up" data-i18n="course"></p>
    <p class="desc" data-i18n="desc"></p>
    <p class="prompt px t up" data-i18n="prompt"></p>
    <div class="actions">
      <button class="btn px t up primary" id="docBtn"><span id="docLabel"></span></button>
      <button class="btn px t up secondary" id="simBtn"><span data-i18n="sim"></span></button>
    </div>
    <p class="note" id="note" role="status"></p>
  </main>

  <footer class="hud bottom px">
    <span><span class="y" style="color:#fff">CREDIT 01</span></span>
    <span class="hearts" aria-hidden="true"><svg class="heart"><use href="#h"/></svg><svg class="heart"><use href="#h"/></svg><svg class="heart"><use href="#h"/></svg><svg class="heart"><use href="#h"/></svg><svg class="heart"><use href="#h"/></svg></span>
    <span class="o">STAGE 01</span>
  </footer>
</div>

<div id="overlay" role="dialog" aria-modal="true">
  <div class="bar"><span class="px t up" data-i18n="simTitle"></span><button class="btn px t up primary close" id="closeBtn" data-i18n="close"></button></div>
  <iframe id="frame" title="Unity Simulator" allowfullscreen allow="fullscreen; autoplay"></iframe>
</div>

<script>
/* ====== EDIT THESE ====== */
const CONFIG = {
  wordFile: "assignment.docx",
  simulatorFile: "simulator.html"
};
const TEXT = {
  en: {
    name1: "Abdolsattar", name2: "Rahimi", course: "Game Design Course",
    desc: "I will publish all research and projects for the Game Design course here.",
    prompt: "Press start button...",
    docFirst: "Download Word file", docOpen: "Open Word file", sim: "Open Unity simulator",
    simTitle: "Unity simulator", close: "Close",
    downloaded: "Downloaded. Check your Downloads folder.",
    opened: "Opening the file you already downloaded, in a new tab.",
    alt: "Profile photo"
  },
  fa: {
    name1: "عبدالستار", name2: "رحیمی", course: "درس بازی‌سازی",
    desc: "تمامی تحقیقات و پروژه های درس بازی سازی در این قسمت قرار خواهم داد",
    prompt: "دکمه استارت را بزنید...",
    docFirst: "دانلود فایل ورد", docOpen: "باز کردن فایل ورد", sim: "باز کردن شبیه‌ساز یونیتی",
    simTitle: "شبیه‌ساز یونیتی", close: "بستن",
    downloaded: "دانلود شد. پوشه Downloads را بررسی کنید.",
    opened: "فایلی که قبلاً دانلود شده بود در یک تب جدید باز می‌شود.",
    alt: "عکس پروفایل"
  }
};
/* ======================== */

/* Pixel stars */
(function(){
  const cols = ["#ffffff","#ffffff","#bfe6ff","#ffe14d","#2de2e6","#ff6fa5","#ffa530"], box = document.getElementById("stars");
  for (let i = 0; i < 70; i++) {
    const s = document.createElement("i"), size = [2,2,3,4][Math.floor(Math.random()*4)], cross = i % 12 === 0;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*62}%;width:${cross?3:size}px;height:${cross?3:size}px;background:${cols[Math.floor(Math.random()*cols.length)]};color:${cols[3+Math.floor(Math.random()*4)]};animation-delay:${(Math.random()*3).toFixed(1)}s`;
    if (cross) s.className = "x"; else if (i % 3) s.style.animation = "none";
    box.appendChild(s);
  }
})();

const $ = s => document.querySelector(s);
const KEY = "wordDownloaded", LKEY = "lang";
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
let lang = store.get(LKEY) === "fa" ? "fa" : "en";

function render(){
  const t = TEXT[lang], root = document.documentElement;
  root.lang = lang; root.dir = lang === "fa" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.title = t.name1 + " " + t.name2 + " | " + t.course;
  $("#photo").alt = t.alt;
  $("#docLabel").textContent = store.get(KEY) ? t.docOpen : t.docFirst;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#note").textContent = "";
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set(LKEY, lang); render(); });

/* Button 1: first click downloads, later clicks open the file */
$("#docBtn").onclick = () => {
  const url = new URL(CONFIG.wordFile, location.href).href;
  if (store.get(KEY)) {
    window.open("https://view.officeapps.live.com/op/view.aspx?src=" + encodeURIComponent(url), "_blank", "noopener");
    $("#note").textContent = TEXT[lang].opened;
  } else {
    const a = document.createElement("a");
    a.href = url; a.download = CONFIG.wordFile;
    document.body.appendChild(a); a.click(); a.remove();
    store.set(KEY, "1");
    $("#docLabel").textContent = TEXT[lang].docOpen;
    $("#note").textContent = TEXT[lang].downloaded;
  }
};

/* Button 2: Unity simulator in fullscreen overlay */
const overlay = $("#overlay"), frame = $("#frame");
$("#simBtn").onclick = () => {
  if (!frame.getAttribute("src")) frame.src = CONFIG.simulatorFile;
  overlay.classList.add("open"); $("#closeBtn").focus();
};
const closeSim = () => overlay.classList.remove("open");
$("#closeBtn").onclick = closeSim;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSim(); });

render();
</script>
</body>
</html>
